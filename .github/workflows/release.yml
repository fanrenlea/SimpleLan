name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The tag and gradle.properties must agree, otherwise the jar's internal
      # version (baked from mod_version) would not match the release it is in.
      - name: Resolve mod metadata
        id: meta
        run: |
          prop() { sed -n "s/^$1=//p" gradle.properties; }
          version="$(prop mod_version)"
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version=${version} in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(prop minecraft_version)" >> "$GITHUB_OUTPUT"
          echo "neoforge=$(prop neo_version)" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          MINECRAFT: ${{ steps.meta.outputs.minecraft }}
          NEOFORGE: ${{ steps.meta.outputs.neoforge }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/libs/simplelan-*.jar \
            --title "SimpleLan $VERSION" \
            --notes "Minecraft $MINECRAFT / NeoForge $NEOFORGE. 把 simplelan-$VERSION.jar 放进 mods 文件夹即可。"
